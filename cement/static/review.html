<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件輔助審核</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#223e35;font:16px system-ui}header{padding:20px 28px;border-bottom:1px solid #cbd5cd;background:white;display:flex;gap:25px;align-items:center}h1{font-size:23px;margin:0}a{color:#21634d}main{display:grid;grid-template-columns:230px minmax(300px,1fr) 320px;gap:20px;padding:24px;max-width:1550px;margin:auto}section,aside{min-width:0}button,input,select,textarea{font:inherit}button{cursor:pointer;padding:10px 15px;background:white;border:1px solid #adbfb3;border-radius:7px;color:inherit}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ddab46}#list button{display:block;width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}#list button[aria-current=true]{border:2px solid #226449;background:#e0eee4}h2{font-size:18px;overflow-wrap:anywhere}.panel{background:white;padding:20px;border:1px solid #d8e0da;border-radius:10px}pre{font:15px/1.75 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#content{max-height:68vh;overflow:auto}article{padding:18px 0;border-bottom:1px solid #d8e0da}small,.muted{color:#60746a}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:700;margin-bottom:10px}.choice{display:block;border:1px solid #d8e0da;padding:10px;margin:7px 0;border-radius:6px}.choice:has(input:checked){background:#e0eee4;border-color:#226449}.field{display:block;margin:14px 0}.field input,.field select,.field textarea{display:block;width:100%;padding:8px;margin-top:5px;border:1px solid #adbfb3;border-radius:5px}textarea{min-height:70px}.primary{background:#226449;color:white}#message{padding:12px 28px;min-height:45px}#sources{font-size:13px;overflow-wrap:anywhere}.tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}@media(max-width:1050px){main{grid-template-columns:180px 1fr}#form{grid-column:2}}@media(max-width:650px){main{display:block;padding:12px}#list{max-height:180px;overflow:auto}header{padding:15px;flex-wrap:wrap}.panel{margin-bottom:12px}#content{max-height:55vh}}</style>
<header><h1>文件輔助審核</h1><a href="/">返回清冊</a><span id="count"></span></header><div id="message" role="status" aria-live="polite">正在載入文件…</div>
<main><aside><h2>可審核文件</h2><div id="list"></div></aside><section class="panel"><h2 id="title">選擇文件</h2><div id="sources"></div><p id="summary" class="muted"></p><div class="tools"><button id="preview" disabled>片段預覽</button><button id="full" disabled>查看全文</button><button id="copy" disabled>複製片段</button></div><div id="content"></div></section>
<form id="form" class="panel"><fieldset id="fields" disabled><legend>這份文件的主要用途</legend><div id="choices"></div><small id="progressNote">需求數量載入中…</small><label class="field">審核者<input id="reviewer" required maxlength="100" autocomplete="name" list="reviewers"></label><datalist id="reviewers"><option value="pososos"></datalist><button type="button" id="pickReviewer">使用 pososos</button><label class="field">文件群組<input id="group" required maxlength="200" placeholder="例如：cement-australia" list="groups"></label><datalist id="groups"><option value="分類測試"></datalist><button type="button" id="pickGroup">使用 分類測試</button><small>同機構／近似版本使用同群組。</small><label class="field">資料用途<select id="split" required><option value="">請選擇</option value="train">訓練／開發</option><option value="validation">驗證</option><option value="test">獨立測試</option></select></label><small>已參與開發的文件應放訓練／開發。</small><label class="field">判斷理由與頁碼<textarea id="note" maxlength="5000" placeholder="可記錄疑慮或判讀依據"></textarea></label><button class="primary" id="save" type="submit">儲存並下一份</button><button id="skip" type="button">暫不確定／跳過</button><p class="muted">跳過不會寫入標籤。切換文件會保留本頁暫填內容，重新整理前請先儲存。</p></fieldset></form></main>
<script>
const $=id=>document.getElementById(id), names={research:'研究與機理',manual:'操作與工具手冊',guidance:'工程應用指引',safety:'安全資料',industry:'產業與永續報告',experiment_log:'實驗記錄',manuscript_notes:'手稿筆記'};
let docs=[],position=-1,current=null,busy=false,request=0;const drafts=new Map();let visibleText="",targets=[];
function message(s){$('message').textContent=s}
async function api(url,opts){const r=await fetch(url,opts);const body=await r.json();if(!r.ok)throw Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail));return body}
for(const [key,name] of Object.entries(names)){const l=document.createElement('label');l.className='choice';const input=document.createElement('input');input.type='radio';input.name='label';input.value=key;input.required=true;const count=document.createElement('small');count.id='target-'+key;count.style.display='block';l.append(input,document.createTextNode(' '+name),count);$('choices').append(l)}
function remember(){if(!current)return;drafts.set(current.document_id,{label:document.querySelector('input[name=label]:checked')?.value||'',group:$('group').value,split:$('split').value,note:$('note').value})}
function drawList(){ $('list').replaceChildren();docs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=(d.label?'✓ ':'○ ')+(d.title||d.sources[0]?.source_id||d.id.slice(0,12));b.setAttribute('aria-current',String(i===position));b.disabled=busy;b.onclick=()=>choose(i);$('list').append(b)});$('count').textContent=`${docs.length} 份 · ${docs.filter(d=>d.label).length} 份已有標籤`}
function renderText(data){visibleText=data.pages.map(p=>`第 ${p.page} 頁${p.truncated?'（節錄）':''}\n${p.text}`).join('\n\n');$('copy').disabled=!visibleText;$('copy').textContent=data.full?'複製全文':'複製片段';$('content').replaceChildren();$('summary').textContent=data.full?`全文 · ${data.page_count} 頁解析文字（圖表請查看來源原檔）`:`片段預覽 · 共 ${data.page_count} 頁，顯示有文字的首／中／末頁各最多 1,800 字`;for(const p of data.pages){const a=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('pre');h.textContent=`第 ${p.page} 頁${p.truncated?'（節錄）':''}`;t.textContent=p.text||'此頁沒有可擷取文字';a.append(h,t);$('content').append(a)}$('content').scrollTop=0}
async function choose(i){if(busy)return;remember();position=i;current=null;visibleText='';$('copy').disabled=true;const token=++request;$('fields').disabled=true;$('preview').disabled=$('full').disabled=true;drawList();const d=docs[i];$('title').textContent=d.title||d.sources[0]?.source_id||d.id;$('sources').replaceChildren();for(const s of d.sources){try{const u=new URL(s.url);if(u.protocol!=='https:'&&u.protocol!=='http:')continue;const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';a.textContent='來源原檔：'+s.source_id;$('sources').append(a,document.createElement('br'))}catch{}}for(const m of d.source_metadata||[]){const tag=document.createElement('div');tag.textContent='來源子類：'+m.subtype_zh+' · 領域：'+m.domain+' · 群組：'+m.document_family+'（非人工用途標籤）';$('sources').append(tag)}message('正在讀取…');try{const data=await api('/api/review/'+encodeURIComponent(d.id));if(token!==request)return;current=data;const v=drafts.get(d.id)||{label:data.current_label||'',group:data.group_id,split:data.split,note:''};document.querySelectorAll('input[name=label]').forEach(x=>x.checked=x.value===v.label);$('group').value=v.group;$('split').value=v.split;$('note').value=v.note;drawTargets();$('group').disabled=$('split').disabled=$('pickGroup').disabled=data.membership_locked;$('fields').disabled=false;$('preview').disabled=$('full').disabled=false;renderText(data);message('先閱讀原文片段，再勾選主要用途；需要更多內容可查看全文。')}catch(e){if(token===request)message('讀取失敗：'+e.message)}}
async function textMode(full){if(!current||busy)return;const id=current.document_id,token=++request;$('preview').disabled=$('full').disabled=true;try{const data=await api('/api/review/'+encodeURIComponent(id)+'?full='+full);if(token!==request)return;if(data.text_hash!==current.text_hash){message('文字版本已改變，請重新選擇文件再審核。');return}renderText(data)}catch(e){if(token===request)message('讀取失敗：'+e.message)}finally{if(token===request)$('preview').disabled=$('full').disabled=false}}
function drawTargets(){const split=$('split').value;for(const key of Object.keys(names)){const rows=targets.filter(t=>t.label===key&&(!split||t.split===split));const sum=k=>rows.reduce((n,t)=>n+t[k],0);$('target-'+key).textContent=rows.length?`需求 ${sum('target')} · 已計入 ${sum('ready')} · 剩餘 ${sum('gap')}`:'數量尚未取得'}$('progressNote').textContent=(split?{train:'訓練：每類人工 10＋弱標籤 40',validation:'驗證：每類人工 5',test:'測試：每類人工 10'}[split]:'總需求：每類 65（訓練 50＋驗證 5＋測試 10）')+'。依各配額分別扣除；未審核弱候選不計入，數量達標不代表可訓練。'}
async function refreshTargets(){try{targets=(await api('/api/review-progress')).targets;drawTargets()}catch(e){targets=[];drawTargets();$('progressNote').textContent='數量載入失敗，請重新整理：'+e.message}}
$('split').onchange=drawTargets;
$('pickReviewer').onclick=()=>{$('reviewer').value='pososos'};
$('pickGroup').onclick=()=>{if(!$('group').disabled)$('group').value='分類測試'};
$('copy').onclick=async()=>{if(!visibleText)return;try{await navigator.clipboard.writeText(visibleText);message('已複製目前顯示的內容與頁碼。')}catch{message('瀏覽器未允許複製，請選取內容後按 Ctrl+C。')}};
$('preview').onclick=()=>textMode(false);$('full').onclick=()=>textMode(true);$('skip').onclick=()=>{if(docs.length>1)choose((position+1)%docs.length);else message('已保留，尚未寫入標籤。')};
$('form').onsubmit=async e=>{e.preventDefault();if(!current||busy)return;remember();const v=drafts.get(current.document_id);if(!$('reviewer').value.trim()||!v.group.trim()){message('請填寫審核者與文件群組。');return}busy=true;++request;$('fields').disabled=true;drawList();try{await api('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:current.document_id,text_hash:current.text_hash,current_label:current.current_label,label:v.label,reviewer:$('reviewer').value.trim(),note:v.note,group_id:v.group.trim(),split:v.split})});docs[position].label=v.label;await refreshTargets();drafts.delete(current.document_id);current=null;busy=false;const next=docs.findIndex((d,i)=>i>position&&!d.label);const first=docs.findIndex(d=>!d.label);await choose(next>=0?next:first>=0?first:position);message('已儲存人工審核與群組紀錄。')}catch(err){message('未儲存：'+err.message)}finally{busy=false;$('fields').disabled=!current;drawList()}};
(async()=>{try{docs=(await api('/api/documents')).filter(d=>d.status==='parsed');drawList();await refreshTargets();if(docs.length)await choose(0);else message('目前沒有可審核文件，請先完成下載與文字解析。')}catch(e){message('載入失敗：'+e.message)}})();
</script></html>
