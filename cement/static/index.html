<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水泥知識 · 文件工作台</title>
<style>body{font:16px system-ui;background:#f4f3ee;color:#233b36;margin:0}main{max-width:1100px;margin:50px auto;padding:24px}h1{font-size:32px}button,select{padding:9px;border:1px solid #aaa;border-radius:6px;background:white}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}small{color:#667}pre{white-space:pre-wrap;max-height:350px;overflow:auto;background:white;padding:20px}a{color:#236e63}.top{display:flex;justify-content:space-between;align-items:center}#qr{width:110px}#status{margin:20px 0}</style>
<main><div class="top"><div><small>CEMENT KNOWLEDGE / INTAKE 0.1</small><h1>水泥知識 · 文件工作台</h1><p>收集公開文件，確認用途，建立可追溯的分類資料。</p></div><img id="qr" alt="本工作台 QR Code"></div><p>用途標籤需人工確認；來源建議不會自動加入訓練。</p><p><a href="/review">開啟輔助審核工具 →</a> · <a href="/graph">開啟圖譜候選審核 →</a></p><div class="row"><input id="q" placeholder="關鍵字搜尋全文（不限用途分類）" style="padding:9px;border:1px solid #aaa;border-radius:6px;width:320px"><button id="searchBtn">搜尋</button></div><pre id="searchResults" style="display:none"></pre><button id="reload">重新整理</button><div id="status"></div><table><thead><tr><th>文件／來源</th><th>解析狀態</th><th>確認用途</th><th>內容</th></tr></thead><tbody id="rows"></tbody></table><pre id="preview">選擇「預覽文字」以確認用途。掃描型 PDF 暫不支援 OCR。</pre><h2>最近爬蟲紀錄</h2><pre id="events"></pre></main>
<script>
const labels={research:'研究與機理',manual:'操作與工具指南',guidance:'工程應用指引',safety:'安全資料',industry:'產業與永續報告',experiment_log:'實驗記錄',manuscript_notes:'手稿筆記'};
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{const docs=await api('/api/documents');document.querySelector('#status').textContent=`${docs.length} 份唯一內容文件 · ${docs.filter(d=>d.label).length} 份已標註`;const rows=document.querySelector('#rows');rows.replaceChildren();for(const d of docs){const tr=document.createElement('tr'),name=document.createElement('td');name.append(document.createTextNode(d.title||d.id.slice(0,16)));for(const s of d.sources){const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=s.source_id;name.append(document.createElement('br'),a)}const state=document.createElement('td');state.textContent=d.status;const cell=document.createElement('td'),select=document.createElement('select');for(const [v,t] of [['','待確認'],...Object.entries(labels)]){const o=new Option(t,v);o.selected=v===(d.label||'');select.add(o)}select.onchange=async()=>{try{await api(`/api/documents/${d.id}/label`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:select.value||null})});await load()}catch(e){alert(e.message)}};cell.append(select);const action=document.createElement('td'),b=document.createElement('button');b.textContent='預覽文字';b.onclick=async()=>{try{document.querySelector('#preview').textContent=(await api(`/api/documents/${d.id}/text`)).text||'尚無可用文字'}catch(e){alert(e.message)}};action.append(b);tr.append(name,state,cell,action);rows.append(tr)}document.querySelector('#events').textContent=(await api('/api/events')).map(e=>`${e.created_at} ${e.status} ${e.url}\n${e.detail}`).join('\n\n')}catch(e){document.querySelector('#status').textContent=e.message}}
document.querySelector('#qr').src='/api/qr?url='+encodeURIComponent(location.origin+'/');document.querySelector('#reload').onclick=load;load();
async function runSearch(){const q=document.querySelector('#q').value.trim(),box=document.querySelector('#searchResults');if(!q){box.style.display='none';return}box.style.display='block';box.textContent='搜尋中…';try{const rows=await api('/api/search?q='+encodeURIComponent(q));box.textContent=rows.length?rows.map(r=>`[${r.label||'待確認'} · ${r.status}] ${r.title||r.document_id.slice(0,16)}\n${r.snippet}`).join('\n\n'):'沒有符合的文件（搜尋涵蓋全部用途，不受分類篩選）。'}catch(e){box.textContent='搜尋失敗：'+e.message}}
document.querySelector('#searchBtn').onclick=runSearch;document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
</script></html>
